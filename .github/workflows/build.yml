name: Build APK

on: 
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Unpack NovaAI.zip if uploaded
        run: |
          if [ -f NovaAI.zip ]; then
            unzip -o -q NovaAI.zip -d /tmp/up
            rm -rf /tmp/up/NovaAI/.github
            cp -r /tmp/up/NovaAI/. .
            rm NovaAI.zip
            git config user.name "nova-bot"
            git config user.email "nova-bot@users.noreply.github.com"
            git add -A
            git commit -m "Update from NovaAI.zip" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
